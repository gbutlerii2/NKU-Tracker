document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"22a932ea-36ae-4f26-866e-820de3e9c8ae\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"101f7d89-4be6-487a-8f1d-bef4dc8ce312\"><\u002Fscript>\n<script type=\"module\" src=\"f57e760c-9b61-420a-9612-415d961b985d\"><\u002Fscript>\n<style>\n:root{\n--color-bg:#ffffff;--color-surface:#f6f2e7;--color-text:#1e2a20;\n--color-accent:#2e6b3e;--color-accent-2:#8a7440;\n--color-divider:color-mix(in srgb,#1e2a20 30%,transparent);\n--color-accent-100:#e9f0ea;--color-accent-200:#d3e1d7;--color-accent-300:#a9c5b1;\n--color-accent-400:#6fa07d;--color-accent-500:#3c8450;--color-accent-600:#245634;\n--color-accent-700:#1b4127;--color-accent-800:#14301d;--color-accent-900:#0d2013;\n--color-accent-2-100:#f4ecd9;--color-accent-2-200:#e7d9b8;--color-accent-2-300:#d9c9a3;\n--color-accent-2-500:#a98f52;--color-accent-2-700:#6f5c30;--color-accent-2-800:#524323;\n--color-neutral-100:#faf7f0;--color-neutral-200:#efe9dc;--color-neutral-300:#ded5c2;\n--color-neutral-400:#c5b99f;--color-neutral-500:#a3977e;--color-neutral-800:#3c4a3f;--color-neutral-900:#1e2a20;\n}\nbody{margin:0;background:#e7dfcc;font-family:var(--font-body)}\n.nkt-scroll::-webkit-scrollbar{width:9px;height:9px}\n.nkt-scroll::-webkit-scrollbar-thumb{background:color-mix(in srgb,#201e1d 22%,transparent)}\n.nkt-scroll::-webkit-scrollbar-track{background:transparent}\n.nkt-row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--color-divider);background:transparent;cursor:pointer;font-family:var(--font-body);text-align:left;color:var(--color-text)}\n.nkt-row:hover{background:color-mix(in srgb,#201e1d 5%,transparent)}\n.nkt-row.nkt-tg{background:var(--color-accent-100)}\n.nkt-row.nkt-tg:hover{background:var(--color-accent-200)}\n.nkt-row.nkt-tl{background:color-mix(in srgb,var(--color-accent-100) 45%,transparent)}\n.nkt-row.nkt-tl:hover{background:var(--color-accent-100)}\n.nkt-row.nkt-tp{background:#fbf4d6}\n.nkt-row.nkt-tp:hover{background:#f5e9b8}\n.nkt-row.nkt-ty{background:var(--color-accent-2-100)}\n.nkt-row.nkt-ty:hover{background:var(--color-accent-2-200)}\n.nkt-row:active{background:color-mix(in srgb,#201e1d 10%,transparent)}\n.nkt-nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;cursor:pointer;font-family:var(--font-body);text-align:left;color:var(--color-text)}\n.nkt-nav:hover{background:rgba(30,42,32,.10)}\n.nkt-tap:active{opacity:.62}\n@keyframes nktIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}\n@keyframes nktUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}\n@keyframes nktFade{from{opacity:0}to{opacity:1}}\n@keyframes nktDrawer{from{transform:translateX(-100%)}to{transform:none}}\n@keyframes nktSlide{from{transform:translateX(-60px)}to{transform:translateX(180px)}}\n@media print{\n /* Print the open report as a real flowing document: everything outside it is\n    removed from layout (not just hidden), and every ancestor drops the fixed\n    positioning, height caps and scroll boxes that otherwise clip the table to\n    a single page. */\n html,body{height:auto!important;min-height:0!important;overflow:visible!important;background:#fff!important}\n #nkt-shell{zoom:1!important;height:auto!important}\n body *:not(#nkt-report-modal):not(#nkt-report-modal *):not(:has(#nkt-report-modal)){display:none!important}\n body :has(#nkt-report-modal){display:block!important;position:static!important;inset:auto!important;\n  width:auto!important;height:auto!important;max-height:none!important;min-height:0!important;\n  overflow:visible!important;transform:none!important;background:#fff!important;\n  box-shadow:none!important;border:0!important;padding:0!important;margin:0!important;flex:none!important}\n #nkt-report-modal{position:static!important;inset:auto!important;display:block!important;padding:0!important;\n  background:#fff!important;height:auto!important;max-height:none!important;overflow:visible!important}\n #nkt-report-modal *{max-height:none!important;overflow:visible!important;box-shadow:none!important}\n #nkt-report-modal .nkt-clamp{-webkit-line-clamp:unset!important;display:block!important}\n thead{display:table-header-group}\n tr{page-break-inside:avoid;break-inside:avoid}\n .nkt-noprint{display:none!important}\n @page{size:landscape;margin:12mm}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<sc-if value=\"{{ gateBooting }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:9000;background:var(--color-bg);display:flex;align-items:center;justify-content:flex-start;padding:0 0 0 max(24px,6vw)\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">North Kitsap United<\u002Fdiv>\n<div style=\"width:180px;height:2px;background:var(--color-divider);overflow:hidden\"><div style=\"width:60px;height:2px;background:var(--color-accent);animation:nktSlide 1.1s linear infinite\"><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">Connecting to the database…<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ gateSignIn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:9000;background:var(--color-bg);overflow-y:auto;display:flex;flex-direction:column\">\n<div style=\"flex:1;display:grid;grid-template-columns:{{ gateCols }};align-items:stretch;min-height:100%\">\n<div style=\"padding:max(28px,5vh) max(24px,4vw);display:flex;flex-direction:column;justify-content:center;gap:0;max-width:520px;width:100%\">\n<img src=\"https://rotaryknk.org/images/nku/NKU-800x378.png\" alt=\"North Kitsap United\" style=\"width:150px;height:auto;margin-bottom:22px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.025em;margin:0\">Project Tracker<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 65%,transparent);margin-top:10px;text-wrap:pretty\">Donors, giving, phases, crews and tasks for the North Kitsap United build. Sign in to continue.<\u002Fdiv>\n<div style=\"height:2px;background:var(--color-divider);margin:22px 0\"><\u002Fdiv>\n\n<sc-if value=\"{{ authCodeStage }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px\">Enter the code we texted you<\u002Fdiv>\n<div style=\"font-size:12.5px;line-height:1.55;color:color-mix(in srgb,var(--color-text) 65%,transparent);text-wrap:pretty\">A 6-digit code was sent to {{ authCodePhone }}. This device then stays signed in for 30 days.<\u002Fdiv>\n<div class=\"field\"><label>Code<\u002Flabel><input class=\"input\" sc-camel-input-mode=\"numeric\" autocomplete=\"one-time-code\" value=\"{{ authCode }}\" sc-camel-on-change=\"{{ onAuthCode }}\" sc-camel-on-key-down=\"{{ onAuthCodeKey }}\" placeholder=\"123456\" style=\"height:42px;min-height:42px;font-size:18px;letter-spacing:.2em;max-width:200px\"><\u002Fdiv>\n<sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-left:3px solid var(--color-accent);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5;color:var(--color-accent-700)\">{{ authError }}<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ authNotice }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-left:3px solid var(--color-text);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5\">{{ authNotice }}<\u002Fdiv><\u002Fsc-if>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:2px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onAuthCodeSubmit }}\" style=\"height:44px;padding:0 20px\">{{ authCodeLabel }}<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onAuthCodeResend }}\" style=\"height:44px;padding:0 16px\">Send a new code<\u002Fbutton>\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ onAuthCodeCancel }}\" style=\"height:44px;padding:0 4px;border:0;background:transparent;cursor:pointer;font-size:12.5px;text-decoration:underline;color:color-mix(in srgb,var(--color-text) 65%,transparent)\">Start over<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ authPassStage }}\" hint-placeholder-val=\"{{ true }}\">\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ onGoogle }}\" style=\"display:flex;align-items:center;gap:11px;height:46px;padding:0 16px;border:2px solid var(--color-text);background:transparent;cursor:pointer;font-family:var(--font-heading);font-weight:800;font-size:13.5px;color:var(--color-text);text-align:left\" style-hover=\"background:var(--color-neutral-200);border-color:var(--color-accent)\">\n<svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 48 48\" style=\"flex:none\"><path fill=\"#4285F4\" d=\"M45 24c0-1.6-.14-2.7-.44-4H24v8h12.1c-.24 2-1.55 5-4.450 7l6.8 5.3C42.5 36.5 45 30.9 45 24z\"><\u002Fpath><path fill=\"#34A853\" d=\"M24 46c5.9 0 10.9-1.95 14.45-5.7l-6.8-5.3C29.75 36.3 27.2 37.2 24 37.2c-5.7 0-10.5-3.8-12.2-9L4.8 33.4C8.4 40.9 15.6 46 24 46z\"><\u002Fpath><path fill=\"#FBBC05\" d=\"M11.8 28.2c-.45-1.3-.7-2.7-.7-4.2s.25-2.9.7-4.2l-7-5.2C3.65 17.5 3 20.65 3 24s.65 6.5 1.8 9.4l7-5.2z\"><\u002Fpath><path fill=\"#EA4335\" d=\"M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.05-6.05C34.85 4.65 29.9 2 24 2 15.6 2 8.4 7.1 4.8 14.6l7 5.2c1.7-5.2 6.5-9 12.2-9z\"><\u002Fpath><\u002Fsvg>\n<span style=\"flex:1\">Continue with Google<\u002Fspan>\n<\u002Fbutton>\n<div style=\"display:flex;align-items:center;gap:12px;margin:18px 0 14px\"><div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv><span style=\"font-family:var(--font-heading);font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 48%,transparent)\">Or with email<\u002Fspan><div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" type=\"email\" value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmail }}\" placeholder=\"you@nkunited.org\" style=\"height:42px;min-height:42px\"><\u002Fdiv>\n<div class=\"field\"><label>Password<\u002Flabel><input class=\"input\" type=\"password\" value=\"{{ authPass }}\" sc-camel-on-change=\"{{ onAuthPass }}\" sc-camel-on-key-down=\"{{ onAuthKey }}\" placeholder=\"••••••••\" style=\"height:42px;min-height:42px\"><\u002Fdiv>\n<sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid var(--color-accent);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5;color:var(--color-accent-700)\">{{ authError }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ authNotice }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid var(--color-text);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5\">{{ authNotice }}<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:2px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onEmailSignIn }}\" style=\"height:44px;padding:0 20px\">{{ authBusyLabel }}<\u002Fbutton>\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ onForgot }}\" style=\"height:44px;padding:0 4px;border:0;background:transparent;cursor:pointer;font-size:12.5px;text-decoration:underline;color:color-mix(in srgb,var(--color-text) 65%,transparent)\">Forgot password<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;line-height:1.55;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:4px;text-wrap:pretty\">Accounts are by invitation. Ask an NKU admin to add you. Either way you sign in, a code is also texted to your phone.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"height:2px;background:var(--color-divider);margin:24px 0 12px\"><\u002Fdiv>\n<div style=\"font-size:11px;letter-spacing:.04em;color:color-mix(in srgb,var(--color-text) 48%,transparent)\">Firebase project {{ fbProject }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:var(--color-accent);display:flex;flex-direction:column;justify-content:center;padding:max(28px,4vw);position:sticky;top:0;max-height:100vh;align-self:start;min-height:100%\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(30px,4vw,54px);line-height:1;letter-spacing:-.03em;color:#ffffff;text-wrap:balance\">We believe we are<br>better together.<\u002Fdiv>\n<div style=\"height:2px;background:rgba(255,255,255,.4);margin:22px 0 14px\"><\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.6;color:rgba(255,255,255,.9);max-width:380px;text-wrap:pretty\">Every edit writes to Firestore and appears on every other signed-in device within a second. Works offline in the field and syncs when signal returns.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ gateInactive }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:9000;background:var(--color-bg);display:flex;align-items:center;padding:0 max(24px,6vw)\">\n<div style=\"max-width:440px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-.02em\">Account deactivated<\u002Fdiv>\n<div style=\"height:2px;background:var(--color-divider);margin:16px 0\"><\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 70%,transparent);text-wrap:pretty\">{{ authEmailShown }} is signed in but marked inactive. An admin can reactivate it from Admin → Users.<\u002Fdiv>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onSignOut }}\" style=\"height:42px;padding:0 18px;margin-top:20px\">Sign out<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ gateNewPass }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:9000;background:var(--color-bg);display:flex;align-items:center;padding:0 max(24px,6vw);overflow-y:auto\">\n<div style=\"max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-.02em\">Choose your own password<\u002Fdiv>\n<div style=\"height:2px;background:var(--color-divider);margin:6px 0\"><\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 70%,transparent);text-wrap:pretty\">An admin set up {{ authEmailShown }} with a temporary password. Pick a new one to continue — at least six characters.<\u002Fdiv>\n<div class=\"field\"><label>New password<\u002Flabel><input class=\"input\" type=\"password\" value=\"{{ newPass1 }}\" sc-camel-on-change=\"{{ onNewPass1 }}\" style=\"height:42px;min-height:42px\"><\u002Fdiv>\n<div class=\"field\"><label>Type it again<\u002Flabel><input class=\"input\" type=\"password\" value=\"{{ newPass2 }}\" sc-camel-on-change=\"{{ onNewPass2 }}\" sc-camel-on-key-down=\"{{ onNewPassKey }}\" style=\"height:42px;min-height:42px\"><\u002Fdiv>\n<sc-if value=\"{{ newPassError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid var(--color-accent);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5;color:var(--color-accent-700)\">{{ newPassError }}<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:4px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onNewPassSave }}\" style=\"height:44px;padding:0 20px\">{{ newPassLabel }}<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onSignOut }}\" style=\"height:44px;padding:0 16px\">Sign out<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ gateVerify }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:9000;background:var(--color-bg);display:flex;align-items:center;padding:0 max(24px,6vw);overflow-y:auto\">\n<div style=\"max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-.02em\">Verify your email<\u002Fdiv>\n<div style=\"height:2px;background:var(--color-divider);margin:6px 0\"><\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 70%,transparent);text-wrap:pretty\">Text-message sign-in can only be set up on a verified address. Send a link to {{ authEmailShown }}, click it, then come back here.<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:4px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onSendVerify }}\" style=\"height:44px;padding:0 18px\">Send link<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onCheckVerify }}\" style=\"height:44px;padding:0 16px\">I've clicked it<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onSignOut }}\" style=\"height:44px;padding:0 16px\">Sign out<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ gateError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-left:3px solid var(--color-accent);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5;color:var(--color-accent-700)\">{{ gateError }}<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ gateNotice }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-left:3px solid var(--color-text);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5\">{{ gateNotice }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ gateEnroll }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:9000;background:var(--color-bg);display:flex;align-items:center;padding:0 max(24px,6vw);overflow-y:auto\">\n<div style=\"max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-.02em\">Add your mobile number<\u002Fdiv>\n<div style=\"height:2px;background:var(--color-divider);margin:6px 0\"><\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 70%,transparent);text-wrap:pretty\">Each sign-in now needs a code texted to your phone. Check the number below (an admin may have filled it in); we'll text a code to confirm it.<\u002Fdiv>\n<sc-if value=\"{{ enrollNeedCode }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"field\"><label>Code sent to {{ enrollPhone }}<\u002Flabel><input class=\"input\" sc-camel-input-mode=\"numeric\" autocomplete=\"one-time-code\" value=\"{{ enrollCode }}\" sc-camel-on-change=\"{{ onEnrollCode }}\" sc-camel-on-key-down=\"{{ onEnrollCodeKey }}\" placeholder=\"123456\" style=\"height:42px;min-height:42px;font-size:18px;letter-spacing:.2em;max-width:200px\"><\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:4px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onEnrollFinish }}\" style=\"height:44px;padding:0 18px\">{{ enrollFinishLabel }}<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onEnrollBack }}\" style=\"height:44px;padding:0 16px\">Change number<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onSignOut }}\" style=\"height:44px;padding:0 16px\">Sign out<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ enrollNeedPhone }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"field\"><label>Mobile number<\u002Flabel><input class=\"input\" type=\"tel\" autocomplete=\"tel\" value=\"{{ enrollPhone }}\" sc-camel-on-change=\"{{ onEnrollPhone }}\" sc-camel-on-key-down=\"{{ onEnrollPhoneKey }}\" placeholder=\"(360) 555-0123\" style=\"height:42px;min-height:42px;max-width:260px\"><\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:4px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onEnrollSend }}\" style=\"height:44px;padding:0 18px\">{{ enrollSendLabel }}<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onSignOut }}\" style=\"height:44px;padding:0 16px\">Sign out<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ gateError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-left:3px solid var(--color-accent);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5;color:var(--color-accent-700)\">{{ gateError }}<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ gateNotice }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-left:3px solid var(--color-text);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5\">{{ gateNotice }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ gateLocked }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:9000;background:var(--color-bg);display:flex;align-items:center;padding:0 max(24px,6vw);overflow-y:auto\">\n<div style=\"max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-.02em\" der-count=\"12\">\n<div style=\"display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-divider)\">\n<span style=\"font-family:var(--font-heading);font-weight:800;font-size:10px;letter-spacing:.06em;opacity:.6\">{{ r.num }}<\u002Fspan>\n<div style=\"min-width:0\">\n<div style=\"font-size:12.5px;font-weight:600\">{{ r.label }}<\u002Fdiv>\n<sc-if value=\"{{ r.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:10.5px;margin-top:1px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ r.note }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;border:1px solid var(--color-divider);border-right:0\">\n<sc-for list=\"{{ r.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"nkt-tap\" sc-camel-on-click=\"{{ o.on }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;margin-top:10px;font-weight:600\">Effective: {{ u.draftSummary }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:14px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ u.done }}\" style=\"height:34px;padding:0 14px\">Save<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ u.cancel }}\" style=\"height:34px;padding:0 12px\">Cancel<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:16px;max-width:480px\">\n<sc-if value=\"{{ userError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid #b3261e;padding:8px 0 8px 11px;font-size:12.5px;line-height:1.5;margin-bottom:12px;color:#b3261e\">{{ userError }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ inviteOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:2px solid var(--color-accent);padding:14px 15px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:14px\">Add a user<\u002Fdiv>\n<div class=\"field\"><label>Name<\u002Flabel><input class=\"input\" value=\"{{ inviteName }}\" sc-camel-on-change=\"{{ onInviteName }}\" placeholder=\"Full name\" style=\"height:36px;min-height:36px\"><\u002Fdiv>\n<div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" type=\"email\" value=\"{{ inviteEmail }}\" sc-camel-on-change=\"{{ onInviteEmail }}\" placeholder=\"name@nkunited.org\" style=\"height:36px;min-height:36px\"><\u002Fdiv>\n<div class=\"field\"><label>Mobile phone<\u002Flabel><input class=\"input\" type=\"tel\" value=\"{{ invitePhone }}\" sc-camel-on-change=\"{{ onInvitePhone }}\" placeholder=\"(360) 555-0123\" style=\"height:36px;min-height:36px\"><\u002Fdiv>\n<div class=\"field\"><label>Temporary password (optional)<\u002Flabel><input class=\"input\" type=\"text\" autocomplete=\"off\" value=\"{{ invitePassword }}\" sc-camel-on-change=\"{{ onInvitePassword }}\" placeholder=\"At least 6 characters\" style=\"height:36px;min-height:36px\"><\u002Fdiv>\n<div class=\"field\"><label>Roles<\u002Flabel>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n<sc-for list=\"{{ inviteRoleChips }}\" as=\"c\" hint-placeholder-count=\"3\"><button class=\"nkt-tap\" sc-camel-on-click=\"{{ c.on }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ inviteError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid #b3261e;padding:7px 0 7px 11px;font-size:12.5px;color:#b3261e\">{{ inviteError }}<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font-size:11px;line-height:1.55;color:color-mix(in srgb,var(--color-text) 55%,transparent);text-wrap:pretty\">For a Google account, leave the password blank; they use Continue with Google. Otherwise set a temporary password and share it. They choose their own on first sign-in, verify their email and add a mobile number for text codes. Add extra operations afterwards with Edit.<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onSaveInvite }}\" style=\"height:38px;padding:0 16px\">{{ inviteSaveLabel }}<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onCancelInvite }}\" style=\"height:38px;padding:0 14px\">Cancel<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ inviteClosed }}\" hint-placeholder-val=\"{{ true }}\">\n<sc-if value=\"{{ hasInviteMsg }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid #2e6b3e;padding:8px 0 8px 11px;margin-bottom:12px;font-size:12.5px;line-height:1.5;color:#1b4127;text-wrap:pretty\">{{ inviteMsg }}<\u002Fdiv>\n<\u002Fsc-if>\n<button class=\"btn btn-primary btn-block nkt-tap\" sc-camel-on-click=\"{{ onOpenInvite }}\" style=\"height:42px\">+ Add user<\u002Fbutton>\n<\u002Fsc-if>\n<div style=\"border-top:2px solid var(--color-divider);margin-top:20px;padding-top:14px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em\">Team members without a login<\u002Fdiv>\n<div style=\"font-size:11.5px;line-height:1.6;margin-top:6px;color:color-mix(in srgb,var(--color-text) 62%,transparent);text-wrap:pretty\">Board members and volunteers who can own a donation but don't need access to the tracker. They appear in the NKU team assigned list alongside every active user account.<\u002Fdiv>\n<div style=\"display:flex;gap:6px;margin-top:10px\">\n<input class=\"input\" value=\"{{ newTeamName }}\" sc-camel-on-change=\"{{ onNewTeamName }}\" placeholder=\"Full name\" style=\"flex:1;height:36px;min-height:36px\">\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onAddTeamName }}\" style=\"height:36px;padding:0 14px\">Add<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px\">\n<sc-for list=\"{{ teamExtras }}\" as=\"t\" hint-placeholder-count=\"3\">\n<span style=\"display:inline-flex;align-items:center;gap:7px;font-size:11.5px;padding:4px 6px 4px 10px;border:1px solid var(--color-divider)\">{{ t.label }}<button class=\"nkt-tap\" sc-camel-on-click=\"{{ t.remove }}\" style=\"width:18px;height:18px;border:0;background:transparent;cursor:pointer;font-size:12px;line-height:1;color:#b3261e\">×<\u002Fbutton><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ noTeamExtras }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-size:11.5px;margin-top:8px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">None yet — the assigned list is showing user accounts only.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"font-size:11px;margin-top:16px;color:color-mix(in srgb,var(--color-text) 52%,transparent);text-wrap:pretty\">Roles and extra operations set which sections a user sees, which they can edit, and whether dollar amounts reach their device. Define roles under the Roles tab.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ adminIsRoles }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:16px 16px 26px;max-width:760px\">\n<div style=\"font-size:12px;line-height:1.6;margin-bottom:14px;color:color-mix(in srgb,var(--color-text) 65%,transparent);text-wrap:pretty\">A role is a named set of operations. Each section is one operation — off, view only or read / write — and View $$ decides whether amounts reach the device. A user's access is the highest level any of their roles or extra operations gives. Changes apply to everyone holding the role.<\u002Fdiv>\n<sc-for list=\"{{ roleCards }}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"border-top:2px solid var(--color-divider);padding:12px 0\">\n<div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n<div style=\"flex:1;min-width:200px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-.01em\">{{ r.name }}<\u002Fdiv>\n<div style=\"font-size:11.5px;line-height:1.5;margin-top:2px;color:color-mix(in srgb,var(--color-text) 60%,transparent);text-wrap:pretty\">{{ r.summary }}<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"tag tag-neutral\">{{ r.members }}<\u002Fspan>\n<sc-if value=\"{{ r.locked }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-outline\">Locked<\u002Fspan><\u002Fsc-if>\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ r.toggle }}\" style=\"height:28px;padding:0 10px;border:1px solid var(--color-divider);background:transparent;cursor:pointer;font-size:11.5px\">{{ r.toggleLabel }}<\u002Fbutton>\n<sc-if value=\"{{ r.canDelete }}\" hint-placeholder-val=\"{{ false }}\">\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ r.remove }}\" title=\"Delete this role\" style=\"height:28px;width:28px;padding:0;border:1px solid #b3261e;background:transparent;cursor:pointer;font-size:11.5px;color:#b3261e\">✕<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ r.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:12px;max-width:620px\">\n<sc-if value=\"{{ r.canRename }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;gap:6px;margin-bottom:12px\">\n<input class=\"input\" value=\"{{ r.nameDraft }}\" sc-camel-on-change=\"{{ r.onNameDraft }}\" style=\"flex:1;height:34px;min-height:34px\">\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ r.onRename }}\" style=\"height:34px;padding:0 14px\">Rename<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ r.locked }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:11.5px;margin-bottom:10px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">Admin always holds every operation and can't be edited.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"border-top:2px solid var(--color-divider)\">\n<sc-for list=\"{{ r.rows }}\" as=\"r\" hint-placeholder-count=\"12\">\n<div style=\"display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-divider)\">\n<span style=\"font-family:var(--font-heading);font-weight:800;font-size:10px;letter-spacing:.06em;opacity:.6\">{{ r.num }}<\u002Fspan>\n<div style=\"min-width:0\">\n<div style=\"font-size:12.5px;font-weight:600\">{{ r.label }}<\u002Fdiv>\n<sc-if value=\"{{ r.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:10.5px;margin-top:1px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ r.note }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;border:1px solid var(--color-divider);border-right:0\">\n<sc-for list=\"{{ r.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"nkt-tap\" sc-camel-on-click=\"{{ o.on }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"border-top:2px solid var(--color-divider);padding-top:14px;display:flex;gap:6px\">\n<input class=\"input\" value=\"{{ newRoleName }}\" sc-camel-on-change=\"{{ onNewRoleName }}\" placeholder=\"New role name, e.g. Event Crew\" style=\"flex:1;height:36px;min-height:36px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onAddRole }}\" style=\"height:36px;padding:0 14px\">+ Add role<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ hasRoleError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid #b3261e;padding:7px 0 7px 11px;margin-top:10px;font-size:12.5px;color:#b3261e\">{{ roleError }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ adminIsReset }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:18px 18px 26px;max-width:620px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"border:2px solid var(--color-divider);padding:14px 16px;display:flex;flex-direction:column;gap:11px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-.01em\">Database<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px\">\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:112px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Firebase project<\u002Fspan><span style=\"font-weight:600\">{{ fbProject }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:112px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Connection<\u002Fspan><span style=\"display:flex;align-items:center;gap:6px;font-weight:600\"><span style=\"{{ syncDotStyle }}\"><\u002Fspan>{{ syncLabel }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:112px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Signed in as<\u002Fspan><span style=\"font-weight:600;word-break:break-all\">{{ signedInEmail }} · {{ myRole }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:112px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Records live<\u002Fspan><span style=\"font-weight:600\">{{ liveCount }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:112px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Amounts<\u002Fspan><span style=\"font-weight:600\">{{ amountAccess }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ moneyWithheld }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid var(--color-accent);padding:8px 0 8px 11px;font-size:12.5px;line-height:1.55;color:var(--color-accent-700);text-wrap:pretty\">Every amount in this database sits in a protected document your role cannot read, so no figure was ever sent to this device. Raise the role in Admin → Users and the numbers appear immediately, no sign-out needed.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font-size:12px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 68%,transparent);text-wrap:pretty\">Every edit writes straight to Firestore and streams to every other signed-in device. Edits made offline queue in the local cache and sync on reconnect.<\u002Fdiv>\n<sc-if value=\"{{ isAdminRole }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onLoadSample }}\" style=\"height:38px;padding:0 16px\">{{ sampleLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ sampleMsg }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid var(--color-text);padding:7px 0 7px 11px;font-size:12.5px;line-height:1.5\">{{ sampleMsg }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"border:2px solid #b3261e;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;color:#b3261e;letter-spacing:-.01em\">Clear records and start fresh<\u002Fdiv>\n<div style=\"font-size:12.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 72%,transparent);text-wrap:pretty\">Deletes the selected records from the database. Your data fields, select choices, managed lists (companies, locations) and user accounts are reference configuration and are kept.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px;padding-top:2px\">\n<sc-for list=\"{{ resetTargets }}\" as=\"t\" hint-placeholder-count=\"5\">\n<label class=\"nkt-tap\" style=\"display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer\">\n<input type=\"checkbox\" checked=\"{{ t.on }}\" sc-camel-on-change=\"{{ t.toggle }}\" style=\"width:15px;height:15px;accent-color:#b3261e;cursor:pointer\">\n<span style=\"flex:1\">{{ t.label }}<\u002Fspan>\n<span style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ t.count }}<\u002Fspan>\n<\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ resetArmed }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-top:1px solid var(--color-divider);padding-top:11px;display:flex;flex-direction:column;gap:9px\">\n<div style=\"font-size:12.5px;font-weight:600\">Type DELETE to confirm — this cannot be undone.<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<input class=\"input\" value=\"{{ resetConfirm }}\" sc-camel-on-change=\"{{ onResetConfirm }}\" placeholder=\"DELETE\" style=\"flex:none;width:150px;height:36px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onResetRun }}\" style=\"height:36px;padding:0 16px;background:#b3261e\">Delete records<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onResetCancel }}\" style=\"height:36px;padding:0 14px\">Cancel<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ resetIdle }}\" hint-placeholder-val=\"{{ true }}\">\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onResetArm }}\" style=\"height:38px;padding:0 16px;align-self:flex-start;border-color:#b3261e;color:#b3261e\">Clear selected records…<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ resetDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px solid var(--color-accent-300);background:var(--color-accent-100);padding:11px 14px;font-size:12.5px;color:var(--color-accent-800)\">{{ resetDoneMsg }}<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font-size:11.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 55%,transparent);text-wrap:pretty\">This deletes the selected records from Firestore for everyone. Data fields, task groups and managed lists are left alone.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ adminIsGroups }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"nkt-scroll\" style=\"flex:1;overflow-y:auto\">\n<div style=\"padding:14px 16px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:9px\">\n<div style=\"font-size:12.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 68%,transparent);text-wrap:pretty\">A task group is a place or a sub-project — a field, a wing, the utility corridor. Tasks are assigned to one group, and a group can span several phases. New groups can also be created straight from the New Task form.<\u002Fdiv>\n<div style=\"display:flex;gap:6px\">\n<input class=\"input\" value=\"{{ newGroupName }}\" sc-camel-on-change=\"{{ onNewGroupName }}\" placeholder=\"New group name\" style=\"flex:1;height:36px;min-height:36px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onAddGroup }}\" style=\"height:36px;padding:0 15px\">Add group<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ groupRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n<div style=\"border-bottom:1px solid var(--color-divider)\">\n<div draggable=\"{{ g.drag.draggable }}\" sc-camel-on-drag-start=\"{{ g.drag.onDragStart }}\" sc-camel-on-drag-end=\"{{ g.drag.onDragEnd }}\" sc-camel-on-drag-over=\"{{ g.drag.onDragOver }}\" sc-camel-on-drop=\"{{ g.drag.onDrop }}\" style=\"display:flex;align-items:center;gap:9px;padding:10px 16px;flex-wrap:wrap\">\n<span title=\"Drag to reorder\" style=\"flex:none;cursor:grab;font-size:12px;line-height:1;color:color-mix(in srgb,var(--color-text) 40%,transparent)\">⠿<\u002Fspan>\n<input class=\"input\" value=\"{{ g.name }}\" sc-camel-on-change=\"{{ g.onName }}\" style=\"flex:1;min-width:150px;height:34px;min-height:34px;font-weight:600\">\n<span style=\"flex:none;font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ g.taskCount }}<\u002Fspan>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ g.onToggle }}\" style=\"flex:none;height:32px;padding:0 12px;font-size:12px\">Phases<\u002Fbutton>\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ g.onRemove }}\" style=\"flex:none;width:28px;height:28px;border:1px solid #b3261e;background:transparent;cursor:pointer;color:#b3261e;font-size:13px;line-height:1\">×<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"padding:0 16px 10px;font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ g.phaseSummary }}<\u002Fdiv>\n<sc-if value=\"{{ g.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:0 16px 14px;display:flex;flex-wrap:wrap;gap:6px\">\n<sc-for list=\"{{ g.phaseChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ noGroups }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:16px;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">No groups yet. Add the first one above.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ adminIsLists }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"nkt-scroll\" style=\"flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:620px\">\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<sc-for list=\"{{ listPanels }}\" as=\"p\" hint-placeholder-count=\"3\">\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ p.pick }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px\">{{ listPanelLabel }}<\u002Fdiv>\n<div style=\"font-size:12px;line-height:1.6;margin-top:5px;color:color-mix(in srgb,var(--color-text) 62%,transparent);text-wrap:pretty\">{{ listPanelNote }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:6px\">\n<input class=\"input\" value=\"{{ newListValue }}\" sc-camel-on-change=\"{{ onNewListValue }}\" placeholder=\"Add a value\" style=\"flex:1;height:36px;min-height:36px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onAddListValue }}\" style=\"height:36px;padding:0 15px\">Add<\u002Fbutton>\n<\u002Fdiv>\n<div>\n<sc-for list=\"{{ listRows }}\" as=\"o\" hint-placeholder-count=\"6\">\n<div draggable=\"{{ o.draggable }}\" sc-camel-on-drag-start=\"{{ o.onDragStart }}\" sc-camel-on-drag-end=\"{{ o.onDragEnd }}\" sc-camel-on-drag-over=\"{{ o.onDragOver }}\" sc-camel-on-drop=\"{{ o.onDrop }}\" style=\"{{ o.rowStyle }}\">\n<span title=\"Drag to reorder\" style=\"flex:none;cursor:grab;font-size:12px;line-height:1;color:color-mix(in srgb,var(--color-text) 40%,transparent);padding:0 2px\">⠿<\u002Fspan>\n<input class=\"input\" value=\"{{ o.label }}\" sc-camel-on-change=\"{{ o.onRename }}\" style=\"flex:1;height:30px;min-height:30px;font-size:12.5px\">\n<span style=\"flex:none;font-size:10.5px;color:color-mix(in srgb,var(--color-text) 48%,transparent);min-width:74px;text-align:right\">{{ o.usage }}<\u002Fspan>\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ o.remove }}\" style=\"flex:none;width:26px;height:26px;border:1px solid var(--color-divider);background:transparent;cursor:pointer;font-size:11px;padding:0;color:#b3261e\">×<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ noListRows }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:12px 0;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Nothing in this list yet.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ adminIsTiers }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"nkt-scroll\" style=\"flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:620px\">\n<div>\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px\">Donor tiers<\u002Fdiv>\n<div style=\"font-size:12px;line-height:1.6;margin-top:5px;color:color-mix(in srgb,var(--color-text) 62%,transparent);text-wrap:pretty\">A donor earns the highest tier their total donations received reach. The tier shows as a badge on the donor, and reaching a new tier puts a recognition certificate on their record until it's printed. Tiers sort by amount automatically.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:2px solid var(--color-divider)\">\n<div style=\"display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--color-divider);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent)\"><span style=\"flex:1\">Name<\u002Fspan><span style=\"width:130px\">Received at least<\u002Fspan><span style=\"width:74px;text-align:right\">Donors<\u002Fspan><span style=\"width:26px\"><\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ tierRows }}\" as=\"t\" hint-placeholder-count=\"9\">\n<div style=\"display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-divider)\">\n<input class=\"input\" value=\"{{ t.name }}\" sc-camel-on-change=\"{{ t.onName }}\" style=\"flex:1;min-width:0;height:30px;min-height:30px;font-size:12.5px;font-weight:600\">\n<input class=\"input\" sc-camel-input-mode=\"numeric\" value=\"{{ t.min }}\" sc-camel-on-change=\"{{ t.onMin }}\" style=\"width:130px;height:30px;min-height:30px;font-size:12.5px;text-align:right\">\n<span style=\"width:74px;text-align:right;font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ t.count }}<\u002Fspan>\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ t.remove }}\" title=\"Remove tier\" style=\"flex:none;width:26px;height:26px;border:1px solid var(--color-divider);background:transparent;cursor:pointer;font-size:11px;padding:0;color:#b3261e\">×<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onAddTier }}\" style=\"height:34px;padding:0 14px\">+ Add tier<\u002Fbutton>\n<button class=\"btn btn-ghost nkt-tap\" sc-camel-on-click=\"{{ onResetTiers }}\" style=\"height:34px\">Reset to defaults<\u002Fbutton>\n<sc-if value=\"{{ hasTierDue }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onPrintTierDue }}\" style=\"height:34px;padding:0 14px\">{{ tierDueLabel }}<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ adminIsDisplay }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"nkt-scroll\" style=\"flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:620px\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding-bottom:9px;border-bottom:2px solid var(--color-divider)\">General<\u002Fdiv>\n<div>\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px\">Text size on this computer<\u002Fdiv>\n<div style=\"font-size:12px;line-height:1.6;margin-top:5px;color:color-mix(in srgb,var(--color-text) 62%,transparent);text-wrap:pretty\">Scales the whole desktop interface — type, rows, buttons — so it reads comfortably on a large monitor. The setting is remembered on this browser only and does not change what anyone else sees. Phones and tablets always use the standard size.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<sc-for list=\"{{ textScaleOptions }}\" as=\"o\" hint-placeholder-count=\"5\">\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Currently {{ textScaleLabel }}. 125% is the default.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ adminIsImport }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"nkt-scroll\" style=\"flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:640px\">\n<div style=\"font-size:12.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 68%,transparent);text-wrap:pretty\">Download a template for the section you're loading, fill it in with Excel or Sheets, save as CSV and upload it back. Column headers must match the template; a starred column is required. Names in link columns are isplay:flex;flex-direction:column;gap:3px\">\n<sc-for list=\"{{ importSample }}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"font-size:12px;padding:5px 0;border-top:1px solid color-mix(in srgb,var(--color-text) 12%,transparent)\">{{ r.text }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onCommitImport }}\" style=\"height:38px;padding:0 16px\">Add these records<\u002Fbutton>\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onCancelImport }}\" style=\"height:38px;padding:0 14px\">Discard<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ adminIsFields }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"nkt-scroll\" style=\"display:flex;gap:6px;padding:11px 14px;overflow-x:auto;border-bottom:1px solid var(--color-divider)\">\n<sc-for list=\"{{ schemaTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ t.on }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"{{ fieldEditorStyle }}\">\n<div style=\"min-width:0\">\n<sc-for list=\"{{ schemaFields }}\" as=\"f\" hint-placeholder-count=\"8\">\n<div style=\"border-bottom:1px solid var(--color-divider)\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:10px 16px\">\n<div style=\"flex:1;min-width:0\">\n<div style=\"font-size:13px;font-weight:600\">{{ f.label }}<\u002Fdiv>\n<div style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ f.meta }}<\u002Fdiv>\n<\u002Fdiv>\n<label class=\"nkt-tap\" style=\"flex:none;display:flex;align-items:center;gap:6px;font-size:11.5px;cursor:pointer;padding:0 4px\">\n<input type=\"checkbox\" checked=\"{{ f.required }}\" sc-camel-on-change=\"{{ f.toggleRequired }}\" style=\"width:15px;height:15px;accent-color:#2e6b3e;cursor:pointer\">\nRequired\n<\u002Flabel>\n<sc-if
