s assigned to …\" style=\"flex:2;min-width:220px;height:36px;min-height:36px\">\n<button class=\"btn btn-primary nkt-tap\" sc-camel-on-click=\"{{ onAskRun }}\" style=\"height:36px;padding:0 16px\">Run<\u002Fbutton>\n<sc-if value=\"{{ askHasResult }}\" hint-placeholder-val=\"{{ false }}\">\n<button class=\"btn btn-secondary nkt-tap\" sc-camel-on-click=\"{{ onAskExpand }}\" style=\"height:36px;padding:0 14px\">Expand, print or export<\u002Fbutton>\n<button class=\"btn btn-ghost nkt-tap\" sc-camel-on-click=\"{{ onAskClear }}\" style=\"height:36px\">Clear<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:9px\">\n<sc-for list=\"{{ askExamples }}\" as=\"e\" hint-placeholder-count=\"4\">\n<button class=\"nkt-tap\" sc-camel-on-click=\"{{ e.pick }}\" style=\"cursor:pointer;font-family:var(--font-body);font-size:11.5px;padding:4px 10px;border:1px solid var(--color-divider);background:transparent;text-align:left\">{{ e.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ askHasResult }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:14px;border-top:2px solid var(--color-divider);padding-top:12px\">\n<div style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 62%,transparent);text-wrap:pretty\">{{ askExplain }}<\u002Fdiv>\n<sc-if value=\"{{ askEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:10px;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);text-wrap:pretty\">Nothing in the records matches that. Try fewer words, or a name exactly as it is spelled on the record.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ askIsChart }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;width:100%;margin-top:12px\">\n<svg sc-camel-view-box=\"0 0 960 420\" style=\"width:100%;height:auto;display:block\">\n<sc-for list=\"{{ askBarYTicks }}\" as=\"t\" hint-placeholder-count=\"5\">\n<line x1=\"96\" y1=\"{{ t.y }}\" x2=\"944\" ftType,r.donorType];\n      return \"<tr>\"+cells.map((c,ci)=>'<td style=\"text-align:'+cols[ci][2]+'\">'+esc(c)+\"<\u002Ftd>\").join(\"\")+\"<\u002Ftr>\";\n    }).join(\"\");\n    const doc=`<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>NKU Grant Master Tracker<\u002Ftitle>\n<style>\n@page{size:landscape;margin:11mm}\n*{box-sizing:border-box}\nbody{margin:0;font:8px/1.35 Archivo,system-ui,sans-serif;color:#201e1d}\nh1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}\n.sub{font-size:9px;color:#5c5850;margin:0 0 8px}\ntable{width:100%;table-layout:fixed;border-collapse:collapse}\nth,td{padding:3px 4px;vertical-align:top;word-break:break-word;overflow-wrap:anywhere;border-bottom:.5px solid #c9c4b8}\nth{text-align:left;font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1.5px solid #201e1d;background:#e7d9b8}\nthead{display:table-header-group}\ntr{page-break-inside:avoid;break-inside:avoid}\n<\u002Fstyle><\u002Fhead><body>\n<h1>NKU Grant Master Tracker<\u002Fh1>\n<p class=\"sub\">${esc(rows.length)} open asks, ranked by ${esc(this.state.grantSort||\"probability\")} · generated ${esc(this.today())}<\u002Fp>\n<table><colgroup>${cols.map(c=>'<col style=\"width:'+c[1]+'\">').join(\"\")}<\u002Fcolgroup>\n<thead><tr>${cols.map(c=>\"<th>\"+esc(c[0])+\"<\u002Fth>\").join(\"\")}<\u002Ftr><\u002Fthead>\n<tbody>${body}<\u002Ftbody><\u002Ftable>\n<\u002Fbody><\u002Fhtml>`;\n    const fr=document.createElement(\"iframe\");\n    fr.setAttribute(\"aria-hidden\",\"true\");\n    fr.style.cssText=\"position:fixed;left:-10000px;top:0;width:1400px;height:900px;border:0\";\n    document.body.appendChild(fr);\n    fr.onload=()=>{\n      try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ /* blocked */ }\n      setTimeout(()=>{ if(fr.parentNode) fr.parentNode.removeChild(fr); },1500);\n    };\n    fr.srcdoc=doc;\n  }\n\n  // Excel opens a UTF-8 CSV natively; a real .xlsx would need a zip writer for\n  // no gain here, so the export stays a spreadsheet-ready CSV.\n  exportGrantSheet(){\n    const head=[\"Rank\",\"Donor / funder\",\"Title / event\",\"NKU assigned\",\"Grant amount\",\"Probability\",\"Deadline\",\"Contact person\",\"Contact phone\",\n      \"Application link/email\",\"Match required\",\"Eligible NKU component\",\"Task group / location\",\"Status\",\n      \"Next action\",\"Next reminder\",\"Reminder note\",\"Donation type\",\"Donor type\"];\n    const rows=this.grantRows().map((r,i)=>[i+1,r.donor,r.title,r.owner,\n      this.hideAmounts?\"withheld\":r.amount,r.prob,r.deadline,r.contact,r.contactPhone,r.link,r.match,r.component,r.group,r.status,\n      r.nextAction,r.reminder?r.reminder.date:\"\",r.reminder?r.reminder.note:\"\",r.giftType,r.donorType]);\n    // A spreadsheet wants an empty cell, not the dash the screen uses.\n    const clean=v=>(v===\"—\"||v==null)?\"\":v;\n    const csv=[head,...rows].map(r=>r.map(c=>this.csvCell(clean(c))).join(\",\")).join(\"\\n\")+\"\\n\";\n    this.download(\"NKU-Grant-Master-Tracker.csv\",csv,\"text/csv\");\n  }\n\n  /* ---------------------------------------------------- bulk upload ------ */\n\n  csvCell(v){\n    const s=v==null?\"\":Array.isArray(v)?v.join(\"; \"):String(v);\n    return /[\",\\n]/.test(s)?'\"'+s.replace(/\"/g,'\"\"')+'\"':s;\n  }\n  downloadTemplate(){\n    const sec=this.state.importTarget;\n    const fields=(this.state.schema[sec]||[]);\n    const header=fields.map(f=>f.l+(f.req?\" *\":\"\"));\n    // A commented guide row keeps the template self-explanatory in Excel.\n    const guide=fields.map(f=>{\n      if(f.t===\"Date\") return \"YYYY-MM-DD\";\n      if(f.t===\"Money\") return \"0\";\n      if(f.t===\"Tags\") return \"tag one; tag two\";\n      if(f.t===\"Link\") return f.one?\"name or ID of one \"+f.link.replace(/s$/,\"\"):\"semicolon-separated names\";\n      if(f.t===\"Select\") return (f.o&&f.o.length?f.o.join(\" | \"):\"see Admin list\");\n      return \"\";\n    });\n    const csv=[header.map(h=>this.csvCell(h)).join(\",\"),guide.map(g=>this.csvCell(g)).join(\",\")].join(\"\\n\")+\"\\n\";\n    this.download(sec+\"-template.csv\",csv,\"text/csv\");\n  }\n  download(name,text,mime){\n    const blob=new Blob([text],{type:(mime||\"text/plain\")+\";charset=utf-8\"});\n    const a=document.createElement(\"a\");\n    a.href=URL.createObjectURL(blob);\n    a.download=name;\n    document.body.appendChild(a);\n    a.click();\n    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);\n  }\n  parseCSV(text){\n    const rows=[]; let row=[], cell=\"\", q=false;\n    for(let i=0;i<text.length;i++){\n      const c=text[i];\n      if(q){\n        if(c==='\"'&&text[i+1]==='\"'){cell+='\"';i++;}\n        else if(c==='\"') q=false;\n        else cell+=c;\n      }else if(c==='\"') q=true;\n      else if(c===\",\"){row.push(cell);cell=\"\";}\n      else if(c===\"\\n\"){row.push(cell);rows.push(row);row=[];cell=\"\";}\n      else if(c!==\"\\r\") cell+=c;\n    }\n    if(cell.length||row.length){row.push(cell);rows.push(row);}\n    return rows.filter(r=>r.some(x=>String(x).trim()!==\"\"));\n  }\n  readImportFile(e){\n    const file=e.target.files&&e.target.files[0];\n    if(!file) return;\n    const reader=new FileReader();\n    reader.onload=()=>{\n      const rows=this.parseCSV(String(reader.result||\"\"));\n      if(rows.length<2){ this.setState({importMsg:\"That file has no data rows.\",importPreview:null}); return; }\n      const header=rows[0].map(h=>String(h).replace(/\\*/g,\"\").trim());\n      const body=rows.slice(1).filter(r=>{\n        // Drop the guide row the template ships with.\n        const j=r.join(\"\").toLowerCase();\n        return !(j.indexOf(\"yyyy-mm-dd\")>=0||j.indexOf(\"semicolon-separated\")>=0);\n      });\n      const out=body.map(r=>{\n        const o={};\n        header.forEach((h,i)=>{ o[h]=String(r[i]==null?\"\":r[i]).trim(); });\n        return o;\n      });\n      this.setState({importPreview:{header,rows:out,skipped:body.length-out.length},\n        importMsg:\"Read \"+out.length+\" row\"+(out.length===1?\"\":\"s\")+\" from \"+file.name+\".\"});\n    };\n    reader.readAsText(file);\n    e.target.value=\"\";\n  }\n  commitImport(){\n    const prev=this.state.importPreview;\n    if(!prev) return;\n    const sec=this.state.importTarget;\n    const fields=(this.state.schema[sec]||[]);\n    const byLabel={};\n    fields.forEach(f=>{ byLabel[f.l.toLowerCase()]=f; });\n    const resolve=(link,val)=>{\n      const src=this.d()[link]||[];\n      const v=String(val).trim().toLowerCase();\n      const hit=src.find(o=>String(o.id).toLowerCase()===v||String(o.name||\"\").toLowerCase()===v||String(o.donorId||\"\").toLowerCase()===v||String(o.code||\"\").toLowerCase()===v);\n      return hit?hit.id:\"\";\n    };\n    let made=0, tagsAdded=[];\n    this.setState(s=>{\n      const data=Object.assign({},s.data);\n      const list=(data[sec]||[]).slice();\n      prev.rows.forEach((row,n)=>{\n        const rec={};\n        Object.keys(row).forEach(h=>{\n          const f=byLabel[h.toLowerCase()];\n          if(!f||row[h]===\"\") return;\n          const raw=row[h];\n          if(f.t===\"Money\") rec[f.k]=Number(String(raw).replace(/[^0-9.]/g,\"\"))||0;\n          else if(f.t===\"Tags\"){\n            const arr=raw.split(/[;,]/).map(x=>x.trim()).filter(Boolean);\n            rec[f.k]=arr; tagsAdded=tagsAdded.concat(arr);\n          }\n          else if(f.t===\"Link\"&&f.one) rec[f.k]=resolve(f.link,raw);\n          else if(f.t===\"Link\") rec[f.k]=raw.split(/[;]/).map(x=>resolve(f.link,x)).filter(Boolean);\n          else if(f.t===\"Select\"&&f.dyn===\"taskGroups\") rec[f.k]=this.groupIdByName(raw);\n          else rec[f.k]=raw;\n        });\n        if(!Object.keys(rec).length) return;\n        rec.id=sec[0]+\"i\"+Date.now().toString(36)+n;\n        if(sec===\"donors\") rec.donorId=rec.donorId||(\"NKU-\"+(1001+list.length+made));\n        if(sec===\"tasks\"&&!Array.isArray(rec.workerIds)) rec.workerIds=[];\n        list.push(rec); ma :Math.round(r.done/max*100)\n    }));\n  }\n\n  /* ------------------------------------------------ ask for a report ---- */\n\n  // A plain-language question is resolved against the records themselves: one\n  // section, a few filters, an optional grouping. Nothing is invented — if a\n  // phrase isn't recognised it simply doesn't filter, and the summary line\n  // always states exactly what was read.\n  askPeople(){\n    const out=[];\n    const add=n=>{ n=String(n||\"\").trim(); if(n.length>2&&!out.some(x=>x.toLowerCase()===n.toLowerCase())) out.push(n); };\n    (this.teamNames()||[]).forEach(add);\n    this.d().workers.forEach(w=>add(w.name));\n    this.d().donors.forEach(d=>{ add(d.accountOwner); add(d.name); });\n    this.d().transactions.forEach(t=>add(t.team));\n    return out;\n  }\n  askDateKey(sec,r){\n    if(sec===\"transactions\") return String(r.completedAt||r.date||\"\").slice(0,10);\n    if(sec===\"donors\") return String(r.prospectiveDate||\"\").slice(0,10);\n    if(sec===\"tasks\") return String(r.start||\"\").slice(0,10);\n    if(sec===\"events\") return String(r.date||\"\").slice(0,10);\n    if(sec===\"phases\") return String(r.start||\"\").slice(0,10);\n    return \"\";\n  }\n  askMoney(sec,r){\n    if(sec===\"transactions\") return Number(r.amount)||0;\n    if(sec===\"donors\") return this.donorReceived(r.id);\n    if(sec===\"tasks\") return Number(r.cost)||0;\n    if(sec===\"phases\") return Number(r.budget)||0;\n    if(sec===\"events\") return this.eventTotal(r);\n    return 0;\n  }\n  askHay(sec,r){\n    const bits=[];\n    Object.keys(r||{}).forEach(k=>{ if(typeof r[k]===\"string\") bits.push(r[k]); });\n    if(sec===\"transactions\"){ const dn=this.donor(r.donorId); if(dn) bits.push(dn.name||\"\",dn.org||\"\",dn.accountOwner||\"\"); }\n    if(sec===\"tasks\"){\n      (r.workerIds||[]).forEach(id=>{ const w=this.worker(id); if(w) bits.push(w.name||\"\",w.company||\"\"); });\n      const p=this.phase(r.phaseId); if(p) bits.push(p.name||\"\",p.code||\"\");\n    }\n    if(sec===\"events\") (r.attendees||[]).forEach(a=>bits.push(this.attLabel(a)));\n    return bits.join(\" \").toLowerCase();\n  }\n  askGroupVal(sec,r,g){\n    const dk=this.askDateKey(sec,r);\n    if(g===\"month\") return dk?dk.slice(0,7):\"No date\";\n    if(g===\"year\") return dk?dk.slice(0,4):\"No date\";\n    if(g===\"status\") return r.status||\"—\";\n    if(g===\"type\") return r.type||r.giftType||\"—\";\n    if(g===\"tier\") return r.tier||\"—\";\n    if(g===\"priority\") return r.priority||\"—\";\n    if(g===\"method\") return r.method||\"—\";\n    if(g===\"probability\") return r.probability||\"—\";\n    if(g===\"owner\"){\n      if(sec===\"transactions\") return this.donationOwner(r)||\"Unassigned\";\n      if(sec===\"donors\") return r.accountOwner||\"Unassigned\";\n      if(sec===\"tasks\") return (r.workerIds||[]).map(id=>(this.worker(id)||{}).name).filter(Boolean).join(\", \")||\"Unassigned\";\n      return \"—\";\n    }\n    if(g===\"donor\") return sec===\"transactions\"?((this.donor(r.donorId)||{}).name||\"Unlinked\"):(r.name||\"—\");\n    if(g===\"phase\") return sec===\"tasks\"?((this.phase(r.phaseId)||{}).code||\"—\"):(r.code||\"—\");\n    if(g===\"group\") return this.groupName(r.groupId)||\"—\";\n    return \"—\";\n  }\n  askShortLabel(g,v){\n    if(g===\"month\"&&/^\\d{4}-\\d{2}$/.test(v)) return MONTHS[Number(v.slice(5,7))-1].slice(0,3)+\" \"+v.slice(2,4);\n    return String(v).length>16?String(v).slice(0,15)+\"…\":String(v);\n  }\n  askReport(){\n    const raw=String(this.state.askRun||\"\").trim();\n    if(!raw) return null;\n    const q=\" \"+raw.toLowerCase().replace(/[\\u201c\\u201d\"']/g,\" \")+\" \";\n    const has=(...w)=>w.some(x=>q.indexOf(x)>=0);\n    const SEC=[[\"tasks\",[\"task\",\"to do\",\"to-do\",\"todo\"]],\n      [\"transactions\",[\"donation\",\"gift\",\"giving\",\"raised\",\"pledge\",\"promised\",\"potential\",\"revenue\",\"darts\"]],\n      [\"donors\",[\"donor\",\"funder\",\"prospect\",\"tier s.filter(r=>this.askMoney(sec,r)>=v); notes.push(\"over \"+F.money(v)); }\n    if(under){ const v=num(under[1]); rows=rows.filter(r=>this.askMoney(sec,r)<=v); notes.push(\"under \"+F.money(v)); }\n\n    const yr=/\\b(20\\d{2})\\b/.exec(raw);\n    if(yr){ rows=rows.filter(r=>this.askDateKey(sec,r).slice(0,4)===yr[1]); notes.push(\"in \"+yr[1]); }\n    const mi=MONTHS.findIndex(m=>wordHit(m));\n    if(mi>=0){ const mm=String(mi+1).padStart(2,\"0\"); rows=rows.filter(r=>this.askDateKey(sec,r).slice(5,7)===mm); notes.push(\"in \"+MONTHS[mi]); }\n\n    const GROUPS=[[\"month\",[\"by month\",\"per month\",\"monthly\"]],[\"year\",[\"by year\",\"per year\",\"yearly\",\"annually\"]],\n      [\"status\",[\"by status\"]],[\"owner\",[\"by owner\",\"by assignee\",\"by team\",\"per owner\",\"by person\",\"by worker\"]],\n      [\"tier\",[\"by tier\"]],[\"priority\",[\"by priority\"]],[\"type\",[\"by type\"]],[\"method\",[\"by method\"]],\n      [\"probability\",[\"by probability\",\"by confidence\"]],[\"donor\",[\"by donor\",\"per donor\"]],\n      [\"phase\",[\"by phase\"]],[\"group\",[\"by group\",\"by location\"]]];\n    let group=\"\";\n    GROUPS.forEach(p=>{ if(!group&&p[1].some(w=>q.indexOf(w)>=0)) group=p[0]; });\n    const wantsMoney=has(\"total\",\"sum\",\"amount\",\"dollars\",\"raised\",\"revenue\",\"$\",\"how much\",\"money\");\n    const wantsChart=has(\"bar\",\"graph\",\"chart\",\"plot\",\"visual\");\n\n    const sum=rows.reduce((n,r)=>n+this.askMoney(sec,r),0);\n    const secLabel={transactions:\"donations\",donors:\"donors\",tasks:\"tasks\",events:\"events\",workers:\"workers & contractors\",phases:\"phases\"}[sec];\n\n    let sumRows=[], chart=null;\n    if(group){\n      const map={};\n      rows.forEach(r=>{\n        const k=this.askGroupVal(sec,r,group);\n        const o=map[k]||(map[k]={label:k,count:0,total:0});\n        o.count++; o.total+=this.askMoney(sec,r);\n      });\n      sumRows=Object.keys(map).map(k=>map[k]);\n      if(group===\"month\"||group===\"year\") sumRows.sort((a,b)=>a.label<b.label?-1:1);\n      else sumRows.sort((a,b)=>wantsMoney?(b.total-a.total):(b.count-a.count));\n      if(sumRows.length>24) sumRows=sumRows.slice(0,24);\n      sumRows=sumRows.map(r=>Object.assign({},r,{short:this.askShortLabel(group,r.label),\n        totalText:this.money(r.total),countText:String(r.count)}));\n      if(sumRows.length){\n        const vals=sumRows.map(r=>wantsMoney?r.total:r.count);\n        const max=this.niceMax(Math.max.apply(null,vals.concat([0])));\n        const x0=96,x1=944,yTop=24,yBase=372, n=sumRows.length, slot=(x1-x0)/n;\n        const bw=Math.max(8,Math.min(64,Math.round(slot*0.6)));\n        const rects=[], labels=[];\n        sumRows.forEach((r,i)=>{\n          const v=vals[i], cx=x0+i*slot+slot/2;\n          const h=v>0?Math.max(2,Math.round((v/max)*(yBase-yTop))):0;\n          rects.push({x:Math.round(cx-bw/2),y:yBase-h,w:bw,h,fill:GREEN});\n          labels.push({label:r.short,style:\"position:absolute;bottom:1%;left:\"+(cx/960*100).toFixed(2)+\"%;transform:translateX(-50%);font-size:9.5px;color:#5c6a5e;white-space:nowrap\"});\n        });\n        const yTicks=[];\n        for(let i=0;i<=4;i++){\n          const v=max*i/4, yy=Math.round(yBase-(v/max)*(yBase-yTop));\n          yTicks.push({y:yy,label:wantsMoney?F.money(v):String(Math.round(v)),\n            style:\"position:absolute;left:0;width:9%;text-align:right;top:\"+(yy/420*100).toFixed(2)+\"%;transform:translateY(-50%);font-size:10.5px;color:#5c6a5e;white-space:nowrap\"});\n        }\n        chart={rects,labels,yTicks};\n      }\n    }\n\n    const money=v=>this.money(v);\n    const COLS={\n      transactions:[[\"Donor\",r=>(this.donor(r.donorId)||{}).name||\"Unlinked\",\"1.4fr\"],[\"Title / event\",r=>r.title||\"—\",\"1.2fr\"],\n        [\"Amount\",r=>money(Number(r.amount)||0),\"90px\",\"right\"],[\"Status\",r=>r.status||\"—\",\"110px\"],\n        [\"Date entered\",r=>this.askDateKey(\"transactions\",r)||\"—\",\"110px\"],[\"Owner\",r=>this.donationOwner(r)||\"Unassigned\",\"1fr\"]],\n      donors:[[\"Name\",r=>r.name||\"—\",\"1.5fr\"],[\"ID\",r=>r.donorId||\"—\",\"84px\"],[\"Type\",r=>r.type||\"—\",\"96px\"],\n        [\"Status\",r=>r.status||\"—\",\"124px\"],[\"Received\",r=>money(this.donorReceived(r.id)),\"92px\",\"right\"],\n        [\"Potential\",r=>money(this.donorPotential(r.id)),\"92px\",\"right\"],[\"Owner\",r=>r.accountOwner||\"Unassigned\",\"1fr\"]],\n      tasks:[[\"Task\",r=>r.name||\"—\",\"1.6fr\"],[\"Type\",r=>r.type||\"General\",\"104px\"],[\"Phase\",r=>(this.phase(r.phaseId)||{}).code||\"—\",\"70px\"],\n        [\"Status\",r=>r.status||\"—\",\"130px\"],[\"Start\",r=>r.start||\"—\",\"96px\"],\n        [\"Assigned to\",r=>(r.workerIds||[]).map(id=>(this.worker(id)||{}).name).filter(Boolean).join(\", \")||\"Unassigned\",\"1.2fr\"],\n        [\"Est. cost\",r=>money(Number(r.cost)||0),\"90px\",\"right\"]],\n      events:[[\"Event\",r=>r.name||\"—\",\"1.6fr\"],[\"Date\",r=>String(r.date||\"\").slice(0,10)||\"—\",\"110px\"],\n        [\"Attendees\",r=>String((r.attendees||[]).length),\"84px\",\"right\"],[\"Raised\",r=>money(this.eventTotal(r)),\"96px\",\"right\"]],\n      workers:[[\"Name\",r=>r.name||\"—\",\"1.4fr\"],[\"Company\",r=>r.company||\"Independent\",\"1.2fr\"],\n        [\"Trade / role\",r=>r.trade||\"—\",\"1.2fr\"],[\"Status\",r=>r.status||\"—\",\"110px\"]],\n      phases:[[\"Code\",r=>r.code||\"—\",\"70px\"],[\"Phase\",r=>r.name||\"—\",\"1.6fr\"],[\"Budget\",r=>money(Number(r.budget)||0),\"100px\",\"right\"],\n        [\"Status\",r=>r.status||\"—\",\"120px\"],[\"Start\",r=>r.start||\"—\",\"96px\"],[\"Finish\",r=>r.end||\"—\",\"96px\"]]\n    }[sec]||[];\n    const cellStyle=(align,head)=>\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\"+\n      (align===\"right\"?\"text-align:right;\":\"\")+(head?\"\":\"font-size:12.5px\");\n    const capped=rows.slice(0,200);\n    const table={\n      cols:COLS.map(c=>c[2]).join(\" \"),\n      head:COLS.map(c=>({l nth={};\n    this.d().transactions.filter(t=>this.statusIs(t.status,\"Received\")).forEach(t=>{\n      const k=String(t.completedAt||t.date||\"\").slice(0,7);\n      if(/^\\d{4}-\\d{2}$/.test(k)) byMonth[k]=(byMonth[k]||0)+(Number(t.amount)||0);\n    });\n    const keys=Object.keys(byMonth).sort();\n    const nowKey=this.today().slice(0,7);\n    const first=keys.length?keys[0]:nowKey;\n    const last=keys.length?(keys[keys.length-1]>nowKey?keys[keys.length-1]:nowKey):nowKey;\n    let y=Number(first.slice(0,4)), m=Number(first.slice(5,7))-1;\n    const ey=Number(last.slice(0,4)), em=Number(last.slice(5,7))-1;\n    const months=[];\n    while((y<ey||(y===ey&&m<=em))&&months.length<36){ months.push({y,m}); m++; if(m>11){ m=0; y++; } }\n    if(months.length<2){\n      const p=months[0]||{y:Number(nowKey.slice(0,4)),m:Number(nowKey.slice(5,7))-1};\n      months.unshift(p.m===0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1});\n    }\n    let run=0;\n    const don=months.map(o=>{\n      run+=byMonth[o.y+\"-\"+String(o.m+1).padStart(2,\"0\")]||0;\n      return run;\n    });\n    const max=this.niceMax(run);\n    const x0=96, x1=944, yTop=24, yBase=372;\n    const px=i=>Math.round(x0+i*((x1-x0)/(don.length-1)));\n    const py=v=>Math.round(yBase-(v/max)*(yBase-yTop));\n    const yTicks=[];\n    for(let i=0;i<=4;i++){\n      const v=max*i/4;\n      yTicks.push({y:py(v),label:F.money(v),\n        style:\"position:absolute;left:0;width:9%;text-align:right;top:\"+(py(v)/420*100).toFixed(2)+\"%;transform:translateY(-50%);font-size:10.5px;color:#5c6a5e;white-space:nowrap\"});\n    }\n    const every=months.length>18?2:1;\n    const monthTicks=months.map((o,i)=>({x:px(i),label:(i%every===0||i===months.length-1)?(MONTHS[o.m].slice(0,3)+(o.m===0||i===0?\" \"+String(o.y).slice(2):\"\")):\"\",\n      style:\"position:absolute;bottom:1%;left:\"+(px(i)/960*100).toFixed(2)+\"%;transform:translateX(-50%);font-size:9.5px;color:#5c6a5e;white-space:nowrap\"}));\n    return {donationPoints:don.map((v,i)=>px(i
